app:
  profile: dev
http:
  host: localhost
  port: "80"
  connect_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  max_header_megabytes: 1
  cors:
    enabled: true
    allowed_origins: []
  max_body_limit: 100
postgres:
  addr: ""
  db_name: ""
  user: ""
  password: ""
  conn_max_lifetime: 180
  max_open_conns: 100
  max_idle_conns: 100
  min_open_conns: 6
redis:
  addr: ""
  user: ""
  password: ""
  db_index: 0
log:
  format: json
  level: info
  console_colored: false
  trace: fatal
  with_caller: false
  with_stack_trace: false
key_value:
  engine: redis
file_storage:
  type: local
  path: storage
  bucket: ""
search_engine:
  type: meili_search
  host: http://localhost:7700
  api_key: ""
kafka:
  brokers: []
  topics:
    products: store.products
    variants: store.product-variants
  producer:
    required_acks: all
  consumer:
    group_id: go-store
workers:
  image_sync: 3
  mail_send: 2
images:
  jpeg_quality: 82
  webp_quality: 80
  max_source_pixels: 40000000
  presets: []
email:
  enabled: false
  host: localhost
  port: 1025
  username: ""
  password: ""
  from: no-reply@go-store.local
  from_name: go-store
  base_url: http://localhost:8888
auth:
  otp_code_ttl: 10m0s
  otp_max_attempts: 5
  otp_resend_window: 1m0s
  otp_hourly_limit: 5
order:
  currency: RUB
  flat_shipping: "0"
  free_shipping_from: "0"
  pending_ttl: 30m0s
  timezone: UTC
cdek:
  enabled: false
  base_url: https://api.cdek.ru/v2
  account: ""
  secure_password: ""
  request_timeout: 15s
  delivery_points_cache_ttl: 48h0m0s
  delivery_points_refresh_every: 24h0m0s
  delivery_points_country_code: RU
yandex_delivery:
  enabled: false
  base_url: https://b2b-authproxy.taxi.yandex.net
  oauth_token: ""
  request_timeout: 3m0s
  delivery_points_cache_ttl: 48h0m0s
  delivery_points_refresh_every: 24h0m0s
