name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve release tag and verify it is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "Resolved tag: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease \
            --jq 'if .isDraft then error("release is a draft") elif .isPrerelease then error("release is a prerelease") else empty end'
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'go-store_*_linux_amd64.tar.gz' \
            --output archive.tar.gz
          tar -xzf archive.tar.gz go-store
          chmod +x go-store

      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "go-store"
          target: "/etc/go-store"
          strip_components: 0
          overwrite: true
          rm: false

      - name: Install and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            sudo /usr/sbin/setcap cap_net_bind_service+ep /etc/go-store/go-store
            sudo /usr/bin/systemctl restart go-store.service
            sudo /usr/bin/systemctl is-active --quiet go-store.service
