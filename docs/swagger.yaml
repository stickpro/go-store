info:
  contact:
    email: go-store@stick.sh
    name: Vladislav B
  description: This is an API for go-store
  title: GO-store
  version: "1.0"
paths:
  /api/v1/cart:
    delete:
      description: Removes all items from the cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Clear cart
      tags:
      - Cart
    get:
      description: Returns the current cart for authenticated user or guest session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Get cart
      tags:
      - Cart
  /api/v1/cart/items:
    post:
      consumes:
      - application/json
      description: Adds a product variant to the cart. If the variant is already present,
        its quantity is increased.
      parameters:
      - description: Item to add
        in: body
        name: Add
        required: true
        schema:
          $ref: '#/definitions/AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Add item to cart
      tags:
      - Cart
  /api/v1/cart/items/{variantId}:
    delete:
      description: Removes the specified variant from the cart
      parameters:
      - description: Variant UUID
        in: path
        name: variantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Sets a new quantity for the specified variant in the cart
      parameters:
      - description: Variant UUID
        in: path
        name: variantId
        required: true
        type: string
      - description: New quantity
        in: body
        name: create
        required: true
        schema:
          $ref: '#/definitions/UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Update cart item quantity
      tags:
      - Cart
  /api/v1/product_review/:
    post:
      consumes:
      - application/json
      description: Create Product Review
      parameters:
      - description: Create Product Review Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_stickpro_go-store_internal_delivery_http_request_product_review_request.CreateProductReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-ProductReviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/APIErrors'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/APIErrors'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrors'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrors'
      security:
      - BearerAuth: []
      summary: Create Product Review
      tags:
      - Product Review
  /api/v1/product_review/by-product/{id}:
    post:
      consumes:
      - application/json
      description: Get Product Reviews By Product ID
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: page_size
        type: integer
      - in: query
        name: product_id
        type: string
      - description: '"asc" or "desc"'
        in: query
        name: sort_by_rating
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-ResponseWithFullPagination-ProductReviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/APIErrors'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Get Product Reviews By Product ID
      tags:
      - Product Review
  /api/v1/viewed-products:
    get:
      description: Returns the last 10 viewed product variants for the current user
        or guest session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-ViewedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Get viewed products
      tags:
      - Viewed
    post:
      consumes:
      - application/json
      description: Records a product variant as viewed for the current user or guest
        session
      parameters:
      - description: Variant to track
        in: body
        name: add
        required: true
        schema:
          $ref: '#/definitions/TrackViewedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/APIErrors'
      summary: Track viewed product
      tags:
      - Viewed
  /v1/admin/dashboard:
    get:
      consumes:
      - application/json
      description: Aggregated admin overview. Order status/payment buckets and totals
        are all-time; `today` uses the store-timezone day; `from`/`to` (RFC3339, default
        today) drive revenue.period and average_order_value. Revenue counts payment_status=paid
        orders only.
      parameters:
      - in: query
        name: from
        type: string
      - in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-DashboardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
      security:
      - BearerAuth: []
      summary: Dashboard overview
      tags:
      - Admin Dashboard
  /v1/admin/orders:
    get:
      consumes:
      - application/json
      description: Admin order list. Every filter is optional.
      parameters:
      - description: |-
          CreatedFrom, CreatedTo bound created_at, inclusive. RFC3339, e.g.
          "2025-01-01T00:00:00Z".
        in: query
        name: created_from
        type: string
      - in: query
        name: created_to
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: page_size
        type: integer
      - enum:
        - unpaid
        - paid
        - refunded
        - failed
        in: query
        name: payment_status
        type: string
      - enum:
        - pending
        - paid
        - processing
        - shipped
        - delivered
        - cancelled
        - refunded
        in: query
        name: status
        type: string
      - in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-ResponseWithFullPagination-AdminOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - Admin Order
  /v1/admin/orders/{number}:
    get:
      consumes:
      - application/json
      description: One order by its number, no ownership check
      parameters:
      - description: Order number
        in: path
        name: number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-AdminOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrors'
      security:
      - BearerAuth: []
      summary: Get order
      tags:
      - Admin Order
  /v1/admin/orders/{number}/status:
    patch:
      consumes:
      - application/json
      description: Transitions an order to a new status. Invalid transitions from
        the order's current status return 409.
      parameters:
      - description: Order number
        in: path
        name: number
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JSONResponse-AdminOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrors'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrors'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/APIErrors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/APIErrors'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - Admin Order
